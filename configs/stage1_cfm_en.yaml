# ==============================================================================
# CẤU HÌNH HUẤN LUYỆN STAGE 1: OT-CFM TARGET DECODER (TIẾNG ANH - ENGLISH)
# Chuẩn bị Acoustic Teacher phát âm Tiếng Anh chuẩn cho S2ST Vi -> En
# Tuân thủ quy chuẩn SKILL2.md cho Molab GPU Runtime
# ==============================================================================

model:
  whisper_model: "vinai/PhoWhisper-small" # Đồng bộ thống nhất PhoWhisper-small cho toàn dự án
  encoder_dim: 768
  cond_dim: 512
  n_mels: 100
  spk_dim: 192
  target_encoder: "vinai/PhoWhisper-small"   # encoder PHÍA ĐÍCH (nghe audio En -> c). EXP02 so với "openai/whisper-small"
  decoder_preset: "v2"     # v1 (cũ: t 1 kênh, conv k3, 4.6M) | v2 (FiLM t+speaker, dilated conv, 20.5M) | v2-small (6.7M)
  t_sampling: "uniform"    # uniform | logit_normal  — chọn theo kết quả 'bash run.sh compare-decoder'

training:
  batch_size: 8
  learning_rate: 2.0e-4
  min_lr: 1.0e-5          # LR cosine giảm dần về min_lr
  weight_decay: 1.0e-4
  epochs: 60
  steps_per_epoch: 300    # 300 x 8 = 2400 câu/epoch (~1 lượt FLEURS en_us train)
  val_clips: 32           # tập validation CỐ ĐỊNH (cùng câu, cùng t/x0 mỗi epoch)
  eval_wer_every: 5       # mỗi 5 epoch: CFM tái tạo -> Vocos -> Whisper-En -> WER
  eval_wer_clips: 16
  max_grad_norm: 1.0
  bf16: true
  sync_drive: true        # tự đẩy checkpoint lên gdrive:runs/<exp>/checkpoints/ sau mỗi epoch

data:
  dataset_name: "google/fleurs"
  lang: "en_us" # Huấn luyện bộ giải mã nói tiếng Anh chuẩn bản ngữ
  sources: "fleurs"                                   # fleurs | fleurs+phost (chọn theo EXP03)
  phost_manifest: "data/phost/manifest_train.jsonl"   # tạo bằng: bash run.sh prepare-phost train 50
  phost_weight: 0.7                                   # tỉ lệ câu PhoST khi trộn
  sample_rate: 24000
  sample_rate_whisper: 16000
  max_audio_sec: 12.0
  streaming: true

paths:
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
